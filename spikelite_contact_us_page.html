<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Spikelite Footwear</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Navbar -->
<header class="bg-black text-white p-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold">SPIKELITE</h1>
  <nav class="space-x-6">
    <a href="index.html" class="hover:text-orange-400">Home</a>
    <a href="about.html" class="hover:text-orange-400">About</a>
    <a href="#" class="text-orange-400">Contact</a>
  </nav>
</header>

<!-- Hero Section -->
<section class="bg-gradient-to-r from-black to-gray-800 text-white text-center py-20">
  <h2 class="text-5xl font-extrabold mb-4">Contact Us</h2>
  <p class="text-lg">We’d love to hear from you</p>
</section>

<!-- Contact Section -->
<section class="py-16 px-6 bg-white">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-10">

    <!-- Contact Form -->
    <div>
      <h3 class="text-2xl font-bold mb-6">Send a Message</h3>
      <form>
        <input type="text" placeholder="Your Name" class="w-full border p-3 mb-4 rounded-lg">
        <input type="email" placeholder="Your Email" class="w-full border p-3 mb-4 rounded-lg">
        <input type="text" placeholder="Subject" class="w-full border p-3 mb-4 rounded-lg">
        <textarea placeholder="Your Message" class="w-full border p-3 mb-4 rounded-lg"></textarea>
        <button class="bg-orange-500 text-white px-6 py-3 rounded-full hover:bg-orange-600">Send Message</button>
      </form>
    </div>

    <!-- Contact Info -->
    <div class="bg-gray-100 p-8 rounded-xl shadow">
      <h3 class="text-2xl font-bold mb-6">Get in Touch</h3>
      <p class="mb-4 text-gray-700"><strong>Address:</strong><br> Bahadurgarh, Haryana, India</p>
      <p class="mb-4 text-gray-700"><strong>Phone:</strong><br> +91 9876543210</p>
      <p class="mb-4 text-gray-700"><strong>Email:</strong><br> support@spikelite.com</p>
      <p class="text-gray-700"><strong>Working Hours:</strong><br> Mon - Sat: 9 AM - 7 PM</p>
    </div>

  </div>
</section>

<!-- Map Section -->
<section class="px-6 pb-16">
  <div class="max-w-6xl mx-auto">
    <iframe class="w-full h-80 rounded-xl" src="https://maps.google.com/maps?q=Bahadurgarh%20Haryana&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
  </div>
</section>

<!-- Footer -->
<footer class="bg-black text-white text-center p-4">
  <p>© 2026 Spikelite Footwear. All rights reserved.</p>
</footer>

</body>
</html>
